name: LookiMac
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

packages:
  LookiKit:
    path: LookiKit

schemes:
  LookiMac:
    build:
      targets:
        LookiMac: all
    run:
      config: Debug

targets:
  LookiMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: LookiMac
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: LookiKit
        product: LookiKit
      # Explicit on purpose: with Xcode 27 / macOS 26 SDK, `import AVKit` autolinks only the
      # `_AVKit_SwiftUI` overlay, which does not hard-link AVKit.framework. Without this line
      # SwiftUI's VideoPlayer aborts at first display ("failed to demangle superclass of
      # VideoPlayerView from mangled name 'So12AVPlayerViewC'"). Verified 2026-09-05.
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_NAME: LookiMac
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.lookimac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS: LookiMac/LookiMac.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: LookiMac/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleName: Looki pour Mac
        CFBundleDisplayName: Looki pour Mac
        CFBundleIdentifier: fr.lauriat.lookimac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: ""
